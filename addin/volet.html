<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paysage</title>
<!--
  Le volet.

  Rien ne doit ressembler a une barre de progression, a un score, ni a un
  rappel : pas de chiffre, pas de pourcentage, pas de compteur de mots. Ce qui
  est montre est le paysage, et rien d'autre. Le seul texte est le bouton qui
  ouvre la vue d'ensemble, le mot qui s'affiche quand quelque chose empeche
  le paysage de pousser, et la question du prenom — une fois, et seulement si
  celui qui offre l'a ecrite.

  Office.js vient du CDN de Microsoft, qui est la seule dependance possible :
  Word refuse de charger un add-in autrement. Le reste du code est a nous, sans
  bibliotheque, comme le veut la decision 13.
-->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --fond: #faf8f4;
    --encre: #2c3230;
    --pale: #8d8880;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--fond); color: var(--encre);
    font: 13px/1.5 Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  /* Le paysage prend tout ce qu'il peut. Le volet Word est une colonne
     etroite et haute — c'est pour ca que la vue d'ensemble est ailleurs. */
  #paysage { flex: 1 1 auto; min-height: 0; }
  #paysage svg { display: block; width: 100%; height: 100%; }
  #pied {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 12px 12px;
  }
  /* pre-line : le volet est etroit, et un message a deux temps doit pouvoir
     respirer. Sans ca les retours a la ligne se replient en espaces. */
  #mot { color: var(--pale); font-size: 12px; font-style: italic;
         white-space: pre-line; }
  /* La question du prenom : posee une fois, aussi discrete que le reste.
     [hidden] doit gagner sur le display du formulaire, sinon il s'affiche
     avant que le volet ait decide de le montrer. */
  #demande {
    flex: 0 0 auto;
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 12px 0;
  }
  #demande[hidden] { display: none; }
  #question { font-size: 12px; font-style: italic; }
  #prenom {
    font: inherit; font-size: 13px; color: var(--encre);
    background: none; border: 0; border-bottom: 1px solid var(--pale);
    padding: 2px 0; outline: none;
  }
  #hors { color: var(--pale); font-size: 11px; min-height: 1em; }
  #partie-prenom, #partie-genre { display: flex; flex-direction: column; gap: 4px; }
  #demande [hidden] { display: none; }
  #question-genre { margin: 0; font-size: 12px; font-style: italic; }
  .choix { display: flex; gap: 16px; }
  .choix button[aria-pressed="true"] {
    color: var(--encre); border-bottom-color: var(--encre);
  }
  /* Un bouton discret : il ne demande rien, il ouvre. */
  button {
    font: inherit; font-size: 12px; color: var(--pale);
    background: none; border: 0; border-bottom: 1px solid transparent;
    padding: 2px 0; cursor: pointer;
  }
  button:hover, button:focus-visible {
    color: var(--encre); border-bottom-color: var(--pale); outline: none;
  }
</style>
</head>
<body>
  <div id="paysage"></div>
  <!--
    Les deux questions du profil (decision 10) : le prenom, et le genre.
    Chacune posee une fois, a la premiere ouverture, si le manifeste ne donne
    pas sa reponse ; ignoree, jamais reposee.

    ⚠️ LEURS TEXTES SONT CEUX DE QUI OFFRE. « Ton prénom ? » et « Tu te genres
    comment ? » ont ete donnes le 11 septembre 2026. C'est sa voix, comme les
    phrases de nuit : ni l'un ni l'autre ne s'ecrit ni ne se change a sa
    place. Vide, une question ne s'afficherait pas.
    L'insecable garde le « ? » avec son mot dans un volet etroit.

    Les trois choix sont neutres : montrer « fort / forte / fort.e »
    devoilerait une phrase avant sa nuit, « M · F · NB » ne devoile rien.
  -->
  <form id="demande" hidden>
    <div id="partie-prenom">
      <label id="question" for="prenom">Ton prénom&nbsp;?</label>
      <input id="prenom" type="text" autocomplete="given-name" maxlength="40"
             spellcheck="false">
      <span id="hors"></span>
    </div>
    <div id="partie-genre">
      <p id="question-genre">Tu te genres comment&nbsp;?</p>
      <div class="choix">
        <button id="accord-m" type="button">M</button>
        <button id="accord-f" type="button">F</button>
        <button id="accord-i" type="button">NB</button>
      </div>
    </div>
  </form>
  <div id="pied">
    <span id="mot"></span>
    <button id="apercu" type="button">tout voir</button>
  </div>
  <script type="module" src="src/volet.js"></script>
</body>
</html>
